<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HSF · Home (versão antiga) — Fluxo de teste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto:wght@500&display=swap" rel="stylesheet">
<style>
:root{--brand:#c00;--p:#35363b;--s:#505156;--line:#d7d8da;--g50:#f5f5f5;--f:1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#e7e7ea;font-family:'Montserrat',system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
img{display:block;-webkit-user-drag:none;user-select:none}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit;text-align:inherit}
p{margin:0}
.stage{min-height:100%;display:flex;justify-content:center}
#screen{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;overflow:hidden;background:#fff;box-shadow:0 0 40px rgba(0,0,0,.14);user-select:none;-webkit-user-select:none}
.app{position:relative;width:360px;height:calc(100% / var(--f));transform:scale(var(--f));transform-origin:0 0;display:flex;flex-direction:column;background:#fff}
/* cabeçalho */
.heading{flex:none;background:#fff;position:relative;z-index:5}
.sb{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--brand);color:#fff}
.sb .time{font:500 15px/normal 'Roboto',sans-serif;letter-spacing:-.3px}
.sb img{width:66.6px;height:11.33px}
.greet{display:flex;align-items:center;gap:4px;background:var(--brand);padding:0 8px 4px 24px;color:#fff}
.greet p{flex:1;font-size:16px;line-height:1.5;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bell{position:relative;width:44px;height:44px;flex:none}
.bell img{position:absolute;left:10px;top:10px;width:24px;height:24px}
.bdg{position:absolute;left:calc(50% + 4px);top:calc(50% - 20px);min-width:16px;height:16px;border-radius:99px;background:#fff;color:var(--brand);font-size:10px;font-weight:600;line-height:16px;text-align:center;font-style:normal;padding:0 4px}
.tabs{display:flex;background:#fff}
.tab{flex:1;height:48px;border-bottom:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;line-height:20px;color:var(--s);text-align:center;white-space:nowrap}
.tab.on{border-bottom-color:var(--brand);color:var(--p);font-weight:600}
/* conteúdo */
#content{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;background:#fff}
#content::-webkit-scrollbar{display:none}
.panel{display:flex;flex-direction:column;gap:32px;padding-bottom:calc(59px + 32px)}
.panel[hidden]{display:none}
.prod{height:368px;background:var(--g50);flex:none}
.cards{display:flex;gap:16px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;padding:0 24px;height:368px;align-items:center;scrollbar-width:none;scroll-padding:0 24px;overscroll-behavior-x:contain}
.cards::-webkit-scrollbar{display:none}
.cards.one{padding:0 24px}
.pc{flex:none;width:288px;height:320px;background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1);overflow:hidden;display:flex;flex-direction:column;scroll-snap-align:start;will-change:transform}
.pc:last-child{scroll-snap-align:end}
.pc.w{width:312px}
.cc{flex:1;min-height:0;position:relative;background:var(--bg,#ffd200);overflow:hidden}
.cc .im{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:312px;height:125px;overflow:hidden}
.cc .im img{position:absolute;max-width:none}
.cc .ov{position:absolute;inset:0;background:linear-gradient(156.24deg,rgba(0,0,0,.6) 18.06%,rgba(0,0,0,0) 78.75%)}
.cc .st{position:relative;padding:16px 16px 0;display:flex;flex-direction:column;gap:16px}
.pr{position:relative;height:28px}
.bar{position:absolute;left:0;right:0;top:0;height:8px;border-radius:10px;background:rgba(255,255,255,.2)}
.bar i{display:block;height:100%;border-radius:8px}
.pr .l,.pr .r{position:absolute;top:13px;font-size:12px;line-height:1.5;letter-spacing:.3px;color:#fff;white-space:nowrap}
.pr .l{left:0;font-weight:600}.pr .r{right:0;font-weight:400}
.nm{font-size:18px;line-height:1.3;font-weight:600;letter-spacing:.3px;color:#fff}
.ilus{position:absolute;right:5px;top:104px;writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;line-height:1.5;font-weight:600;color:#fff;text-shadow:0 0 4px rgba(0,0,0,.5);z-index:2}
.ac{flex:none;height:64px;display:flex;background:#fff}
.ac button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 4px;font-size:10px;line-height:1.5;font-weight:600;color:var(--s);text-align:center}
.ac button+button{border-left:1px solid var(--line)}
.ac img{width:24px;height:24px}
.more{flex:none;height:44px;border-top:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 16px 0 56px;background:#fff}
.more span{flex:1;text-align:center;font-size:14px;line-height:20px;font-weight:600;color:var(--s)}
.more img{width:24px;height:24px}
/* promoções */
.promo{flex:none;padding:0 24px;display:flex;flex-direction:column;gap:16px}
.promos{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -24px;padding:0 24px 6px;scroll-padding:0 24px;scrollbar-width:none;margin-bottom:-6px;overscroll-behavior-x:contain}
.promos::-webkit-scrollbar{display:none}
.promos>*{flex:none;scroll-snap-align:start}
.promos::after{content:'';flex:0 0 8px}
.pm1{width:273.3px;height:120px;border-radius:14px;box-shadow:0 2px 6px rgba(0,0,0,.1);object-fit:cover}
.pm2{width:272px;height:120px;border-radius:16px;box-shadow:0 2px 6px rgba(0,0,0,.1);background:linear-gradient(108.5deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 100%),#ffd200;display:flex;align-items:center;gap:8px;padding:16px 0 16px 16px;overflow:hidden}
.pm2 .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.pm2 p{font-size:14px;line-height:20px;color:var(--p)}.pm2 p b{font-weight:600}
.pill{background:#fff;color:var(--brand);font-size:10px;line-height:1.5;font-weight:600;padding:4px 8px;border-radius:1000px;white-space:nowrap}
.pm2 img{width:112px;height:120px;object-fit:cover;flex:none}
.dots{display:flex;justify-content:center;gap:8px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:#d3d3d5;display:block;transition:background .2s}
.dots i.on{background:var(--brand)}
/* seções */
.sec{padding:0 24px;display:flex;flex-direction:column;gap:16px;flex:none}
.sec h3{font-size:12px;line-height:1.3;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:#302f32}
.cta{width:312px;background:#fff;border:1px solid var(--line);border-radius:16px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.1));display:flex;align-items:center;gap:16px;padding:16px}
.cta>img:first-child{width:32px;height:32px;flex:none}
.cta .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.cta .tx b{font-size:14px;line-height:20px;font-weight:600;color:var(--p)}
.cta .tx span{font-size:12px;line-height:1.5;letter-spacing:.3px;color:var(--s)}
.cta>img:last-child{width:24px;height:24px;flex:none}
.list{display:flex;flex-direction:column;gap:8px}
.mi{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:.5px solid var(--line);width:100%}
.mi>img{width:24px;height:24px;flex:none}
.mi .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.mi .tx b{font-size:14px;line-height:20px;font-weight:600;color:var(--p)}
.mi .tx span{font-size:12px;line-height:1.5;letter-spacing:.3px;color:var(--s)}
.nps{padding:0 24px 24px;flex:none}
.npsc{width:312px;border:1px solid #d3d3d5;border-radius:16px;filter:drop-shadow(0 8px 8px rgba(0,0,0,.16));background:#fff;overflow:hidden;padding-top:16px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;letter-spacing:.3px}
.npsc .tt{padding:0 16px;display:flex;flex-direction:column;gap:8px;width:100%}
.npsc .tt b{font-size:18px;line-height:1.3;font-weight:600;color:#302f32}
.npsc .tt u{font-size:12px;line-height:1.5;font-weight:600;color:var(--brand);text-underline-position:from-font}
.npsc .tt span{font-size:12px;line-height:1.5;color:#515054}
.npsc img{width:312px;height:48px;object-fit:cover}
/* seguros */
.segc{width:312px;height:320px;background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1);overflow:hidden;display:flex;flex-direction:column;margin:0 auto}
.segc .info{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.segc .info img{width:312px;height:168px}
.segc .info p{padding:16px 16px;text-align:center;font-size:14px;line-height:20px;color:var(--s)}
.segc .info p b{font-weight:600}
.segc .bt{flex:none;background:var(--brand);color:#fff;font-size:14px;line-height:20px;font-weight:600;text-align:center;padding:12px 16px;border-top:1px solid var(--line)}
.segw{height:368px;background:var(--g50);display:flex;align-items:center;flex:none}
/* menu inferior */
.bnav{position:absolute;left:0;right:0;bottom:0;height:59px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:6}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 0;font-size:10px;line-height:1.5;color:var(--s);text-align:center;white-space:nowrap}
.bnav button.on{color:var(--brand);font-weight:600}
.bnav img{width:24px;height:24px}
#toast{position:absolute;left:24px;right:24px;bottom:76px;background:#232326;color:#fff;font-size:12px;line-height:1.45;padding:10px 14px;border-radius:8px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:40;text-align:center}
#toast.on{opacity:1;transform:none}
@media (max-width:480px){.sb{display:none}}
body.force-sb .sb,body.iphone .sb{display:flex!important}
body.hide-sb .sb{display:none!important}
body.static #screen{height:auto}
body.static .app{height:auto}
body.static #content{overflow:visible}
body.static *{pointer-events:none!important}
body.static #toast{display:none}
body.static .stage{min-height:0}
</style>
</head>

function scaleCards() {
  const max = cardsEl.scrollWidth - cardsEl.clientWidth || 1, x = cardsEl.scrollLeft, items = cardsEl.querySelectorAll('.pc');
  [0, max].forEach((pos, i) => { const d = Math.min(1, Math.abs(x - pos) / max); items[i].style.transform = `scale(${1 - .1 * d})`; });
  const c = x > max / 2 ? 2 : 1; if (c !== S.card) { S.card = c; clearTimeout(scaleCards.t); scaleCards.t = setTimeout(view, 120); }
}
cardsEl.addEventListener('scroll', scaleCards, { passive: true });
/* promoções: bolinhas */
document.querySelectorAll('.promos').forEach(p => p.addEventListener('scroll', () => {
  const dots = p.parentElement.querySelectorAll('.dots i'), max = p.scrollWidth - p.clientWidth || 1, i = p.scrollLeft > max / 2 ? 1 : 0;
  dots.forEach((d, n) => d.classList.toggle('on', n === i));
}, { passive: true }));

/* ---------- arrastar com o mouse (como o dedo) ---------- */
let d = null;
document.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse' || e.button !== 0 || !e.target.closest('#content')) return;
  const hs = e.target.closest('.cards:not(.one),.promos');
  d = { x: e.clientX, y: e.clientY, hs, sx: hs ? hs.scrollLeft : 0, sy: content.scrollTop, mode: null };
});
window.addEventListener('pointermove', e => {
  if (!d) return; const dx = e.clientX - d.x, dy = e.clientY - d.y;
  if (!d.mode) { if (Math.hypot(dx, dy) < 6) return; d.mode = (d.hs && Math.abs(dx) > Math.abs(dy)) ? 'h' : 'v'; if (d.mode === 'h') d.hs.style.scrollSnapType = 'none'; }
  if (d.mode === 'h') d.hs.scrollLeft = d.sx - dx / F; else content.scrollTop = d.sy - dy / F;
});
function snapNow(hs) {
  const max = hs.scrollWidth - hs.clientWidth, kids = [...hs.children].filter(k => k.classList && !k.matches('.dots'));
  const pos = hs.classList.contains('cards') ? [0, max] : kids.map(k => Math.min(max, Math.max(0, k.offsetLeft - 24)));
  const to = pos.reduce((a, b) => Math.abs(b - hs.scrollLeft) < Math.abs(a - hs.scrollLeft) ? b : a, pos[0] || 0);
  hs.style.scrollSnapType = ''; hs.scrollTo({ left: to, behavior: 'smooth' });
}
const endDrag = () => { if (!d) return; const o = d; d = null; if (!o.mode) return; justDragged = true; setTimeout(() => { justDragged = false; }, 0); if (o.mode === 'h') snapNow(o.hs); };
window.addEventListener('pointerup', endDrag); window.addEventListener('pointercancel', endDrag);
document.addEventListener('click', e => { if (justDragged) { e.stopPropagation(); e.preventDefault(); } }, true);

/* ---------- cliques ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (t) return setTab(+t.dataset.tab);
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (b.dataset.act === 'sim') openSim(); else toast('Destino fora do escopo deste teste');
});
window.addEventListener('resize', fit);

/* ---- Simulação (Serviços Honda): módulo carregado de simulacao.js ---- */
let simP = null;
function loadSim() {
  if (window.SIM) return Promise.resolve(); if (simP) return simP;
  simP = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'simulacao.js'; s.onload = res; s.onerror = () => { simP = null; rej(new Error('simulacao.js')); }; document.head.appendChild(s); });
  return simP;
}
const simScrollTrack = () => {
  let sst = 0;
  document.addEventListener('scroll', e => {
    const t = e.target; if (!(t && t.classList && t.classList.contains('simscroll'))) return;
    clearTimeout(sst); sst = setTimeout(() => { const f = screenEl.clientWidth / 360; window.parent.postMessage({ hsf: 1, ev: { type: 'scroll', key: keyOf(), top: Math.round(t.scrollTop * f), ch: Math.round(t.clientHeight * f), sh: Math.round(t.scrollHeight * f) } }, '*'); }, 250);
  }, true);
};
function openSim() {
  loadSim().then(() => { SIM.open({ logged: true, start: 'hub', onExit: closeSim, toast, onChange: view }); view(); })
    .catch(() => toast('Não foi possível carregar a simulação (arquivo simulacao.js).'));
}
function closeSim() { SIM.close(); view(); }

/* ---------- visualização estática (mapa de calor do moderador) ---------- */
if (STATIC) {
  document.body.classList.add('static', Q.get('st') === '1' ? 'force-sb' : 'hide-sb');
  setTab(parseInt(Q.get('cur'), 10) || 1, true); fit();
  if (Q.get('sel') === 'c2' && S.tab === 1) { const mx = cardsEl.scrollWidth - cardsEl.clientWidth; cardsEl.style.scrollSnapType = 'none'; cardsEl.scrollLeft = mx; scaleCards(); }
  setTimeout(fit, 400);
  const V = Q.get('view');
  if (V === 'sim' || (V === 'sheet' && Q.get('under') === 'sim')) {
    $('.app').style.display = 'none';
    loadSim().then(() => { const hh = SIM.renderStatic(V === 'sheet' ? 'sheet' : Q.get('cur'), { st: Q.get('st') === '1', logged: true }); screenEl.style.height = hh ? Math.ceil(hh * F) + 'px' : (parseInt(Q.get('h'), 10) || 800) + 'px'; });
  }
}

/* ---------- gravação de toques (modo moderador) ---------- */
if (REC) {
  document.addEventListener('pointerdown', e => { window.__d = { x: e.clientX, y: e.clientY, t: performance.now(), tg: e.target, key: keyOf() }; }, true);
  document.addEventListener('pointercancel', () => { window.__d = null; }, true);
  document.addEventListener('pointerup', e => {
    const o = window.__d; window.__d = null; if (!o) return;
    if (Math.hypot(e.clientX - o.x, e.clientY - o.y) > 10 || performance.now() - o.t > 800) return;
    const sc = screenEl.getBoundingClientRect(), ct = content.getBoundingClientRect();
    const inSim = !!o.tg.closest('#sim'), scr = o.tg.closest('.simscroll');
    const inContent = !inSim && !!o.tg.closest('#content'), inNav = !inSim && !!o.tg.closest('.bnav'), x = o.x - sc.left;
    const y = inSim ? (o.y - sc.top) + (scr ? scr.scrollTop * F : 0) : inContent ? (o.y - ct.top) + content.scrollTop * F : o.y - sc.top;
    const el = o.tg.closest('[data-tab],[data-act],button,a');
    let act = '', label = '';
    if (el) { act = el.dataset.tab ? 'tab' : (el.dataset.act || el.tagName.toLowerCase()); label = el.dataset.label || (el.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 40); }
    else { const tx = Array.from(o.tg.childNodes).filter(n => n.nodeType === 3).map(n => n.textContent).join(' ').trim().replace(/\s+/g, ' ').slice(0, 28); label = 'Sem ação' + (tx ? ': ' + tx : ''); }
    const ev = { type: 'tap', key: o.key, x: Math.round(x), xf: +(x / sc.width).toFixed(4), y: Math.round(y), fixed: inSim ? !!o.tg.closest('.sim-sh') : !inContent, hit: !!el, act, label };
    if (inNav || (inSim && o.tg.closest('.simfoot'))) { ev.ab = 1; ev.yb = Math.round(sc.bottom - o.y); }
    window.parent.postMessage({ hsf: 1, ev }, '*');
  }, true);
  simScrollTrack();
  let st = 0;
  content.addEventListener('scroll', () => { clearTimeout(st); st = setTimeout(() => window.parent.postMessage({ hsf: 1, ev: { type: 'scroll', key: keyOf(), top: Math.round(content.scrollTop * F), ch: Math.round(content.clientHeight * F), sh: Math.round(content.scrollHeight * F) } }, '*'), 250); }, { passive: true });
}
window.__recInit = view;
fit(); scaleCards(); view();
</script>
</body>
</html>
